<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<title>Mafia — Party Game</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:image" content="apple-touch-icon.png">
<style>
  :root {
    --bg: #0d0d12; --panel: #17171f; --panel2: #20202b; --line: #2c2c3a;
    --text: #ececf3; --muted: #9a9ab0; --red: #e5484d; --red-d: #7a1f22;
    --green: #30a46c; --blue: #3e8ef7; --gold: #f5b544;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; min-height: 100dvh; }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 34px; margin: 8px 0 4px; letter-spacing: .5px; }
  h2 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 14px 0; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); font-size: 17px; outline: none; }
  input:focus { border-color: var(--blue); }
  input.code { text-transform: uppercase; letter-spacing: 6px; text-align: center; font-weight: 700; }
  button { width: 100%; padding: 14px 16px; border-radius: 12px; border: 0; font-size: 17px; font-weight: 600;
    background: var(--blue); color: #fff; cursor: pointer; margin-top: 10px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  button.danger { background: var(--red); }
  button.good { background: var(--green); }
  .label { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 14px 0 6px; }
  .roomcode { font-size: 46px; font-weight: 800; letter-spacing: 10px; text-align: center; margin: 4px 0; }
  .players { list-style: none; padding: 0; margin: 8px 0 0; }
  .players li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
    background: var(--panel2); margin-bottom: 6px; }
  .players li.dead { opacity: .45; text-decoration: line-through; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex: none; }
  .dot.off { background: #555; }
  .tag { margin-left: auto; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--line); color: var(--muted); }
  .tag.me { background: var(--blue); color: #fff; }
  .targets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .targets button { margin: 0; background: var(--panel2); border: 2px solid var(--line); color: var(--text); padding: 16px 8px; }
  .targets button.sel { border-color: var(--gold); background: #2d2615; }
  .targets button .n { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 2px; }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button { margin: 0; width: 56px; flex: none; font-size: 24px; padding: 8px 0; }
  .stepper .count { flex: 1; text-align: center; font-size: 32px; font-weight: 800; }
  .rolecard { border-radius: 18px; padding: 22px; text-align: center; cursor: pointer; user-select: none;
    border: 1px solid var(--line); background: var(--panel); }
  .rolecard .emoji { font-size: 56px; line-height: 1.1; }
  .rolecard .rname { font-size: 26px; font-weight: 800; margin-top: 4px; }
  .rolecard.mafia { background: linear-gradient(160deg, #3a1214, #17171f); border-color: var(--red-d); }
  .rolecard.doctor { background: linear-gradient(160deg, #0f2f22, #17171f); border-color: #1d5a3f; }
  .rolecard.citizen { background: linear-gradient(160deg, #142640, #17171f); border-color: #24446e; }
  .phase { text-align: center; padding: 26px 18px; }
  .phase .big { font-size: 64px; line-height: 1; }
  .banner { padding: 16px; border-radius: 14px; text-align: center; font-weight: 700; font-size: 19px; margin: 14px 0; }
  .banner.bad { background: #3a1214; border: 1px solid var(--red-d); }
  .banner.good { background: #0f2f22; border: 1px solid #1d5a3f; }
  .banner.neutral { background: var(--panel2); border: 1px solid var(--line); }
  .tally { list-style: none; padding: 0; margin: 8px 0 0; }
  .tally li { display: flex; justify-content: space-between; padding: 8px 12px; background: var(--panel2); border-radius: 10px; margin-bottom: 6px; }
  .err { color: #ff8a8d; min-height: 1.2em; margin-top: 8px; }
  .status { position: fixed; top: 0; left: 0; right: 0; text-align: center; font-size: 13px; padding: 6px; background: #3a2a0a; color: var(--gold); display: none; z-index: 5; }
  .small { font-size: 13px; }
  a { color: var(--blue); }
  .rules li { margin-bottom: 4px; }
</style>
</head>
<body>
<div class="status" id="status"></div>
<main id="app"></main>

<script>
(() => {
'use strict';

/* ---------------- constants & helpers ---------------- */
const MIN_PLAYERS = 3;
const ROLES = {
  mafia:   { emoji: '🔪', name: 'Mafia',   desc: 'Each night, pick someone to eliminate. Don\'t get voted out!' },
  doctor:  { emoji: '💉', name: 'Doctor',  desc: 'Each night, pick someone to save. If it\'s the mafia\'s target, they live.' },
  citizen: { emoji: '🧑', name: 'Citizen', desc: 'Find the mafia during the day and vote them out.' },
};
const POLL_MS = 2000;          // how often phones check for updates
const POLL_HIDDEN_MS = 6000;   // slower while the app is in the background

const $app = document.getElementById('app');
const $status = document.getElementById('status');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : Array.from({ length: 4 }, () => Math.random().toString(36).slice(2, 10)).join('-'));

// A private id for this phone. It is what lets you drop out and come straight back
// into the same game, so it's kept even if the tab is closed.
let secret = store.get('mafia.secret');
if (!secret) { secret = uid(); store.set('mafia.secret', secret); }

function setStatus(msg) { $status.textContent = msg || ''; $status.style.display = msg ? 'block' : 'none'; }

/* ---------------- app-level state ---------------- */
let view = null;          // this player's view of the game, as sent by the server
let ui = { selected: null, revealed: false, error: '' };
let roomCode = null;
let pollTimer = null, polling = false, failures = 0;

/* =========================================================
   SERVER CONNECTION
   Every phone talks to the game server over plain HTTPS. Each request is
   tiny and stands alone, so a patchy connection only delays an update —
   it never breaks the room, and nobody's phone is a single point of failure.
   ========================================================= */
async function api(method, body, query) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  try {
    const res = await fetch('/api/room' + (query ? '?' + new URLSearchParams(query) : ''), {
      method, cache: 'no-store', signal: ctrl.signal,
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({ error: 'Server error (' + res.status + '). Please try again.' }));
    data.status = res.status;
    return data;
  } finally { clearTimeout(timer); }
}

// Retries only when the request never got an answer (no signal, timeout).
async function apiRetry(body, tries = 4) {
  for (let i = 0; ; i++) {
    try { const r = await api('POST', body); setStatus(''); return r; }
    catch (e) {
      if (i >= tries - 1) throw e;
      setStatus('Weak connection — retrying…');
      await sleep(700 * (i + 1));
    }
  }
}

function schedulePoll(ms) {
  clearTimeout(pollTimer);
  if (roomCode) pollTimer = setTimeout(poll, ms != null ? ms : document.hidden ? POLL_HIDDEN_MS : POLL_MS);
}

async function poll() {
  if (!roomCode || polling) return;
  polling = true;
  const code = roomCode;
  try {
    const r = await api('GET', null, { code, secret, v: view && view.code === code ? view.v : '' });
    if (code !== roomCode) return;
    failures = 0; setStatus('');
    if (r.gone) { leaveLocal(); goHome(r.error); return; }
    if (r.view) render(r.view);
  } catch {
    failures++;
    if (failures >= 2) setStatus('Weak connection — reconnecting…');
  } finally {
    polling = false;
    schedulePoll(failures ? Math.min(1000 * failures, 5000) : null);
  }
}
['visibilitychange', 'focus', 'online'].forEach(ev => (ev === 'visibilitychange' ? document : window)
  .addEventListener(ev, () => { if (!document.hidden && roomCode) { clearTimeout(pollTimer); poll(); } }));

function enterRoom(v) {
  roomCode = v.code;
  store.set('mafia.room', v.code);
  history.replaceState(null, '', '?room=' + v.code);
  render(v);
  schedulePoll();
}

async function createRoom(name) {
  store.set('mafia.name', name);
  renderWaiting('Creating room…');
  try {
    const r = await apiRetry({ action: 'create', secret, name });
    r.view ? enterRoom(r.view) : goHome(r.error);
  } catch { setStatus(''); goHome('Could not reach the server. Check your internet and try again.'); }
}

async function joinRoom(name, code) {
  store.set('mafia.name', name);
  renderWaiting('Joining room ' + code + '…');
  try {
    const r = await apiRetry({ action: 'join', secret, name, code });
    r.view ? enterRoom(r.view) : goHome(r.error);
  } catch { setStatus(''); goHome('Could not reach the server. Check your internet and try again.'); }
}

let sending = false;
async function send(msg) {
  if (!roomCode || !view || sending) return;
  // Tag the action with the phase it was tapped in so a retried request can't skip ahead.
  msg = Object.assign({ at: view.phase + ':' + view.round }, msg);
  sending = true;
  try {
    const r = await apiRetry({ action: 'act', secret, code: roomCode, msg });
    if (r.gone || r.status === 404) { leaveLocal(); goHome(r.error); return; }
    ui.error = r.view ? '' : (r.error || '');
    r.view ? render(r.view) : render(view);
  } catch {
    setStatus('');
    ui.error = 'Could not reach the server. Check your internet and tap again.';
    render(view);
  } finally { sending = false; }
}

function leaveLocal() {
  clearTimeout(pollTimer);
  roomCode = null; view = null;
  store.del('mafia.room');
  setStatus('');
}

function leave() {
  if (roomCode) api('POST', { action: 'act', secret, code: roomCode, msg: { t: 'leave' } }).catch(() => {});
  leaveLocal();
}

/* =========================================================
   RENDERING
   ========================================================= */
function goHome(error) {
  view = null;
  history.replaceState(null, '', location.pathname);
  renderHome(error);
}

function renderHome(error = '') {
  const params = new URLSearchParams(location.search);
  const preCode = (params.get('room') || '').toUpperCase();
  const name = store.get('mafia.name') || '';
  $app.innerHTML = `
    <div class="center">
      <img src="logo.svg" alt="Mafia logo" width="112" height="112" style="display:block;margin:14px auto 0;border-radius:26px;box-shadow:0 10px 40px rgba(229,72,77,.25)">
      <h1>Mafia</h1>
      <p class="muted">A party game for 3+ friends in the same room.</p>
    </div>
    <div class="card">
      <div class="label">Your name</div>
      <input id="name" maxlength="20" placeholder="e.g. Priya" value="${esc(name)}" autocomplete="off">
      <div class="label">Join a room</div>
      <div class="row">
        <input id="code" class="code" maxlength="4" placeholder="CODE" value="${esc(preCode)}" autocomplete="off">
      </div>
      <button id="join">Join room</button>
      <div class="center muted small" style="margin:14px 0 4px">— or —</div>
      <button id="create" class="secondary">Create a new room</button>
      <div class="err" id="err">${esc(error)}</div>
    </div>
    <div class="card small muted">
      <b style="color:var(--text)">How to play</b>
      <ol class="rules" style="padding-left:18px;margin:8px 0 0">
        <li>One person creates a room and shares the 4-letter code.</li>
        <li>Everyone joins; the host starts the game and roles are dealt at random, like drawing chits: the host picks how many <b>Mafia</b>, there's <b>1 Doctor</b>, and everyone else is a <b>Citizen</b>. Mafia members know each other.</li>
        <li><b>Night:</b> the Mafia pick someone to kill, then the Doctor picks someone to save. If the Doctor saves the target, nobody dies.</li>
        <li><b>Day:</b> everyone left alive discusses and votes someone out. The app reveals whether they were the Mafia.</li>
        <li>Citizens win by voting out every Mafia. The Mafia win when they equal or outnumber everyone else.</li>
      </ol>
      <p style="margin-top:10px">Works on Wi-Fi or mobile data. If your connection drops or you close the app, just open it again — you'll be right back in the game.</p>
    </div>`;
  const $n = document.getElementById('name'), $c = document.getElementById('code'), $e = document.getElementById('err');
  $c.addEventListener('input', () => { $c.value = $c.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  const getName = () => { const v = $n.value.trim(); if (!v) { $e.textContent = 'Enter your name first.'; $n.focus(); } return v; };
  document.getElementById('join').onclick = () => {
    const n = getName(); if (!n) return;
    const c = $c.value.trim().toUpperCase();
    if (c.length !== 4) { $e.textContent = 'Enter the 4-letter room code.'; $c.focus(); return; }
    joinRoom(n, c);
  };
  document.getElementById('create').onclick = () => {
    const n = getName(); if (!n) return;
    createRoom(n);
  };
  $c.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('join').click(); });
}

function renderWaiting(msg) {
  $app.innerHTML = `<div class="card phase"><div class="big">⏳</div><p>${esc(msg)}</p>
    <button class="secondary" id="cancel">Cancel</button></div>`;
  document.getElementById('cancel').onclick = () => { leave(); goHome(); };
}

function render(v) {
  if (!v) return;
  if (view && view.code === v.code && v.v < view.v) return; // ignore a late, older update
  const prevPhase = view && view.phase + ':' + view.round;
  if (prevPhase !== v.phase + ':' + v.round) { ui.selected = null; }
  view = v;
  const me = v.players.find(p => p.id === v.me);
  const isHost = v.me === v.hostId;
  const byId = id => v.players.find(p => p.id === id);
  let html = '';

  const header = `<div class="row" style="align-items:center;margin-bottom:4px">
      <img src="logo.svg" alt="" width="40" height="40" style="flex:none;border-radius:10px"><div><div class="label" style="margin:0">Room</div><div style="font-weight:800;letter-spacing:4px;font-size:20px">${esc(v.code)}</div></div>
      <div style="text-align:right"><div class="label" style="margin:0">${v.phase === 'lobby' ? 'Lobby' : v.phase === 'over' ? 'Game over' : 'Round ' + v.round}</div>
      <div style="font-weight:600">${esc(me ? me.name : '')}${isHost ? ' · host' : ''}</div></div></div>`;

  const partners = me && me.role === 'mafia' ? v.players.filter(p => p.role === 'mafia' && p.id !== v.me) : [];
  const nameList = arr => arr.length < 2 ? arr.join('') : arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];
  const roleCard = () => {
    if (!me || !me.role) return '';
    const r = ROLES[me.role];
    const team = partners.length ? `<p class="small">Your fellow Mafia: <b>${esc(nameList(partners.map(p => p.name + (p.alive ? '' : ' (dead)'))))}</b></p>` : '';
    if (!ui.revealed) return `<div class="rolecard" id="rolecard"><div class="emoji">🂠</div><div class="rname">Tap to see your role</div><p class="muted small">Keep your screen hidden from others</p></div>`;
    return `<div class="rolecard ${me.role}" id="rolecard"><div class="emoji">${r.emoji}</div><div class="rname">You are ${me.role === 'mafia' && partners.length ? 'a' : 'the'} ${r.name}</div><p class="small">${r.desc}</p>${team}${me.alive ? '' : '<p class="small" style="color:#ff8a8d"><b>You are dead</b> — you can watch, but stay quiet!</p>'}<p class="muted small">Tap to hide</p></div>`;
  };

  const playerList = (opts = {}) => `<ul class="players">${v.players.map(p => `
      <li class="${p.alive || v.phase === 'lobby' ? '' : 'dead'}"><span class="dot ${p.connected ? '' : 'off'}"></span>
      <span>${esc(p.name)}</span>
      ${opts.showRoles && p.role ? `<span class="tag">${ROLES[p.role].emoji} ${ROLES[p.role].name}</span>` : ''}
      ${p.id === v.me ? '<span class="tag me">you</span>' : p.id === v.hostId ? '<span class="tag">host</span>' : ''}
      ${opts.kick && p.id !== v.me ? `<button class="secondary" data-kick="${esc(p.id)}" style="width:auto;margin:0 0 0 6px;padding:4px 10px;font-size:13px">✕</button>` : ''}
      </li>`).join('')}</ul>`;

  const targetGrid = (ids, actionLabel, kind, extra = '') => `
    <div class="targets">${ids.map(id => { const p = byId(id); return `<button data-pick="${esc(id)}" class="${ui.selected === id ? 'sel' : ''}">${esc(p.name)}${id === v.me ? '<span class="n">(you)</span>' : ''}</button>`; }).join('')}${extra}</div>
    <button id="confirm" class="${kind === 'kill' ? 'danger' : kind === 'save' ? 'good' : ''}" ${ui.selected ? '' : 'disabled'}>${actionLabel}</button>`;

  const aliveIds = v.players.filter(p => p.alive).map(p => p.id);

  switch (v.phase) {
    case 'lobby': {
      const shareUrl = location.origin + location.pathname + '?room=' + v.code;
      html = `${header}
        <div class="card center">
          <div class="label">Room code</div>
          <div class="roomcode">${esc(v.code)}</div>
          <p class="muted small">Friends open this site and enter the code, or share the link:</p>
          <button class="secondary" id="share">📤 Share invite link</button>
        </div>
        <div class="card">
          <div class="label" style="margin-top:0">Players (${v.players.length})</div>
          ${playerList({ kick: isHost })}
          ${isHost ? `
            <div class="label">Number of Mafia</div>
            <div class="stepper">
              <button class="secondary" id="mafiaMinus" ${v.mafiaCount <= 1 ? 'disabled' : ''} aria-label="Fewer Mafia">−</button>
              <div class="count" id="mafiaCount">${v.mafiaCount}</div>
              <button class="secondary" id="mafiaPlus" ${v.mafiaCount >= v.maxMafia ? 'disabled' : ''} aria-label="More Mafia">+</button>
            </div>
            <p class="muted small center">${v.mafiaCount >= v.maxMafia && v.players.length >= MIN_PLAYERS ? `Max ${v.maxMafia} Mafia for ${v.players.length} players — add more players for more Mafia.` : ''}</p>` : ''}
          <p class="center" style="margin:12px 0 0">${v.players.length < MIN_PLAYERS ? `<span class="muted small">Need at least ${MIN_PLAYERS} players.</span>` : `${v.mafiaCount} Mafia · 1 Doctor · ${v.players.length - v.mafiaCount - 1} Citizen${v.players.length - v.mafiaCount - 1 === 1 ? '' : 's'}`}</p>
          ${isHost
            ? `<button id="start" class="good" ${v.players.length < MIN_PLAYERS ? 'disabled' : ''}>Start game &amp; deal roles</button>`
            : `<p class="muted center" style="margin-top:14px">Waiting for the host to start…</p>`}
        </div>
        <button class="secondary" id="leave">Leave room</button>`;
      $app.innerHTML = html;
      bindCommon();
      const sh = document.getElementById('share');
      sh.onclick = async () => {
        try { if (navigator.share) { await navigator.share({ title: 'Join my Mafia game', text: `Join my Mafia game! Room code: ${v.code}`, url: shareUrl }); return; } } catch { return; }
        try { await navigator.clipboard.writeText(shareUrl); sh.textContent = '✅ Link copied!'; } catch { prompt('Copy this link:', shareUrl); }
      };
      const st = document.getElementById('start'); if (st) st.onclick = () => send({ t: 'start' });
      const mm = document.getElementById('mafiaMinus'); if (mm) mm.onclick = () => send({ t: 'setMafia', n: v.mafiaCount - 1 });
      const mp = document.getElementById('mafiaPlus'); if (mp) mp.onclick = () => send({ t: 'setMafia', n: v.mafiaCount + 1 });
      document.querySelectorAll('[data-kick]').forEach(b => b.onclick = () => send({ t: 'kick', target: b.dataset.kick }));
      return;
    }

    case 'night_mafia':
    case 'night_doctor': {
      const mafiaTurn = v.phase === 'night_mafia';
      let body;
      if (me.alive && mafiaTurn && me.role === 'mafia') {
        const mv = v.mafiaVotes || {};
        const myPick = mv[v.me];
        if (!ui.selected && myPick) ui.selected = myPick;
        const livePartners = partners.filter(p => p.alive);
        const teamStatus = livePartners.length ? `<div class="label">Your team's picks</div><ul class="tally">${livePartners.map(p =>
          `<li><span>${esc(p.name)}</span><b>${mv[p.id] ? esc(byId(mv[p.id]).name) : '<span class="muted">choosing…</span>'}</b></li>`).join('')}</ul>
          <p class="muted small">The kill happens once every Mafia has picked. If you pick different people, the one with the most picks is chosen (ties are decided at random).</p>` : '';
        body = `<div class="card"><h2>🔪 Choose your victim</h2><p class="muted">${myPick ? `You picked <b>${esc(byId(myPick).name)}</b> — waiting for your team. You can still change it.` : 'Tap a player, then confirm.'}</p>
          ${targetGrid(aliveIds.filter(id => byId(id).role !== 'mafia'), myPick ? 'Change pick' : 'Kill', 'kill')}${teamStatus}</div>`;
      } else if (me.alive && !mafiaTurn && me.role === 'doctor') {
        body = `<div class="card"><h2>💉 Who will you save?</h2><p class="muted">If you pick the Mafia's target, they survive the night.</p>
          ${targetGrid(aliveIds, 'Save', 'save')}</div>`;
      } else {
        const who = mafiaTurn ? 'The Mafia is choosing a victim…' : 'The Doctor is choosing who to save…';
        const extra = (me.role === 'mafia' && !mafiaTurn && v.myKill) ? `<p class="small" style="color:#ff8a8d">The Mafia chose <b>${esc(byId(v.myKill).name)}</b>.</p>` : '';
        body = `<div class="card phase"><div class="big">🌙</div><h2>Night ${v.round}</h2><p class="muted">Everyone close your eyes.</p><p>${who}</p>${extra}</div>`;
      }
      html = `${header}${body}${roleCard()}`;
      break;
    }

    case 'morning': {
      const n = v.lastNight;
      let banner;
      if (!n || !n.victim) banner = `<div class="banner neutral">Nothing happened last night.</div>`;
      else if (n.saved) banner = `<div class="banner good">💉 The Mafia attacked <b>${esc(n.victimName)}</b>, but the Doctor saved them!</div>`;
      else banner = `<div class="banner bad">💀 <b>${esc(n.victimName)}</b> was killed by the Mafia.</div>`;
      html = `${header}<div class="card phase"><div class="big">☀️</div><h2>Day ${v.round}</h2>${banner}
        <p class="muted">Discuss who you think the Mafia is.</p>
        <button id="startVote">Start voting</button><p class="muted small">Anyone can tap this when the group is ready.</p></div>
        <div class="card"><div class="label" style="margin-top:0">Players</div>${playerList()}</div>${roleCard()}`;
      break;
    }

    case 'voting': {
      let body;
      if (!me.alive) {
        body = `<div class="card phase"><div class="big">👻</div><h2>Voting</h2><p class="muted">You're dead, so you can't vote.</p></div>`;
      } else if (v.myVote) {
        const name = v.myVote === 'skip' ? 'Skip' : byId(v.myVote).name;
        body = `<div class="card phase"><div class="big">🗳️</div><h2>Vote cast</h2><p>You voted for <b>${esc(name)}</b>.</p></div>`;
      } else {
        body = `<div class="card"><h2>🗳️ Vote someone out</h2><p class="muted">Who is the Mafia?</p>
          ${targetGrid(aliveIds.filter(id => id !== v.me), 'Cast vote', 'vote',
            `<button data-pick="skip" class="${ui.selected === 'skip' ? 'sel' : ''}" style="grid-column:1/-1">Skip vote</button>`)}</div>`;
      }
      html = `${header}${body}
        <div class="card center"><p><b>${v.votedCount}</b> of <b>${v.aliveCount}</b> players have voted</p>
        ${isHost ? '<button class="secondary" id="forceTally">End voting now</button>' : ''}</div>${roleCard()}`;
      break;
    }

    case 'verdict': {
      html = `${header}<div class="card phase">${verdictHtml(v)}
        <button id="nextNight">Continue to Night ${v.round + 1}</button></div>
        ${tallyHtml(v)}${roleCard()}`;
      break;
    }

    case 'over': {
      const mafiaWon = v.winner === 'mafia';
      const mafia = v.players.filter(p => p.role === 'mafia').map(p => p.name);
      html = `${header}<div class="card phase">
          <div class="big">${mafiaWon ? '🔪' : '🎉'}</div>
          <h2>${mafiaWon ? 'The Mafia wins!' : 'The Citizens win!'}</h2>
          ${lastEventHtml(v)}
          <p>The Mafia ${mafia.length > 1 ? 'were' : 'was'} <b>${esc(nameList(mafia))}</b>.</p>
          <button id="playAgain" class="good">Back to lobby</button>
        </div>
        <div class="card"><div class="label" style="margin-top:0">Roles</div>${playerList({ showRoles: true })}</div>
        <button class="secondary" id="leave">Leave room</button>`;
      break;
    }
  }

  html += `<div class="err center">${esc(ui.error || '')}</div>`;
  $app.innerHTML = html;
  bindCommon();
}

function lastEventHtml(v) {
  // Explain the final event that ended the game
  if (v.verdict && v.verdict.eliminated) return verdictLine(v.verdict);
  const n = v.lastNight;
  if (n && n.victim && !n.saved) return `<div class="banner bad">💀 <b>${esc(n.victimName)}</b> was killed during the night.</div>`;
  return '';
}

function verdictLine(vd) {
  if (!vd.eliminated) return vd.tie ? `<div class="banner neutral">It's a tie — nobody was voted out.</div>` : `<div class="banner neutral">The town chose to skip — nobody was voted out.</div>`;
  return vd.wasMafia
    ? `<div class="banner good">🎯 <b>${esc(vd.name)}</b> was voted out… and they <b>WERE ${vd.mafiaTotal > 1 ? 'a' : 'the'} Mafia!</b>${vd.mafiaLeft > 0 ? `<div class="small" style="font-weight:500;margin-top:6px">${vd.mafiaLeft} Mafia still at large.</div>` : ''}</div>`
    : `<div class="banner bad">😬 <b>${esc(vd.name)}</b> was voted out… they were <b>NOT ${vd.mafiaTotal > 1 ? 'a' : 'the'} Mafia.</b></div>`;
}

function verdictHtml(v) {
  return `<div class="big">⚖️</div><h2>The town has spoken</h2>${verdictLine(v.verdict)}`;
}

function tallyHtml(v) {
  if (!v.tally || !v.tally.length) return '';
  return `<div class="card"><div class="label" style="margin-top:0">Votes</div><ul class="tally">${v.tally.map(t => `<li><span>${esc(t.name)}</span><b>${t.n}</b></li>`).join('')}</ul></div>`;
}

function bindCommon() {
  const rc = document.getElementById('rolecard');
  if (rc) rc.onclick = () => { ui.revealed = !ui.revealed; render(view); };
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { ui.selected = b.dataset.pick; render(view); });
  const cf = document.getElementById('confirm');
  if (cf) cf.onclick = () => {
    if (!ui.selected) return;
    const kind = view.phase === 'night_mafia' ? 'kill' : view.phase === 'night_doctor' ? 'save' : 'vote';
    send({ t: kind, target: ui.selected });
  };
  const map = { startVote: 'startVote', forceTally: 'forceTally', nextNight: 'nextNight', playAgain: 'playAgain' };
  for (const id in map) { const el = document.getElementById(id); if (el) el.onclick = () => send({ t: map[id] }); }
  const lv = document.getElementById('leave');
  if (lv) lv.onclick = () => {
    if (view && view.phase !== 'lobby' && view.phase !== 'over' && !confirm('Leave this game?')) return;
    leave(); goHome();
  };
}

/* ---------------- boot ---------------- */
const savedRoom = store.get('mafia.room');
if (savedRoom) {
  roomCode = savedRoom;
  renderWaiting('Rejoining room ' + savedRoom + '…');
  poll();
} else {
  renderHome();
}

// exposed for automated tests
window.__mafia = { get view() { return view; }, send };
})();
</script>
</body>
</html>
